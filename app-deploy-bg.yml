apiVersion: apps/v1
kind: Deployment
metadata:
  name: world-cup-backend-green
spec:
  replicas: 3
  selector:
    matchLabels:
      app: world-cup-backend
      version: green
  template:
    metadata:
      labels:
        app: world-cup-backend
        version: green
    spec:
      containers:
      - name: backend
        image: world-cup-rest:1.0.1  # Tag a actualizar por CI/CD
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 500m
            memory: 256Mi
        ports:
          - containerPort: 8000
---
apiVersion: v1
kind: Service
metadata:
  name: backend-service
spec:
  selector:
    app: world-cup-backend
    version: green # Intercambio Blue/Green se hace aquí apuntando al selector
  ports:
    - protocol: TCP
      port: 80
      targetPort: 8000
